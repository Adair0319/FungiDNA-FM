# Conda environment for FungiDNA-FM inference.
#
#   conda env create -f environment.yml
#   conda activate fungidna
#
# The CUDA toolchain is included because mamba-ssm and flash-attn are built
# from source (PyPI ships sdists only). gcc 12 is required: CUDA 12.1 refuses
# gcc > 12.
name: fungidna
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.5.1
  - pytorch-cuda=12.1
  - cuda-nvcc=12.1
  - cuda-cudart-dev=12.1
  - cuda-cccl=12.1
  - gcc_linux-64=12
  - gxx_linux-64=12
  - pip
  - pip:
      - -r requirements.txt
